events {
    worker_connections 1024;
}

http {
    # ── Configurações gerais ───────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50M;  # Upload de planilhas grandes
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Upstream services ──────────────────────────────────────────────────
    upstream api {
        server api:8000;
    }

    upstream n8n {
        server n8n:5678;
    }

    # ── Servidor principal ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;  # Aceita qualquer domínio — troque pelo seu domínio

        # ── App principal (TRF1 + outros módulos) ─────────────────────────
        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;  # Timeout alto para processamentos longos
            proxy_send_timeout 300s;
        }

        # ── WebSocket (progresso em tempo real) ───────────────────────────
        location /ws/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;  # 24h para WebSocket
        }

        # ── n8n (automações) ──────────────────────────────────────────────
        location /n8n/ {
            proxy_pass http://n8n/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Health check ──────────────────────────────────────────────────
        location /health {
            return 200 'CAPFI System OK';
            add_header Content-Type text/plain;
        }
    }
}
